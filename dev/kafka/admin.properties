# Client settings for Kafka's CLI tools as the dev admin user, inside the kafka container:
#   docker compose exec kafka /opt/kafka/bin/kafka-topics.sh \
#     --bootstrap-server kafka:9092 --command-config /etc/kafka/admin.properties --list
security.protocol=SASL_PLAINTEXT
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="dev-admin";
