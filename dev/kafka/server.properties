# Kafka broker configuration: reference for production, used as-is by the dev stack.
#
# Production uses the same settings; only the lines marked [deploy] differ
# (listener addresses and the admin password). The production Ansible role
# templates this file and fills in those values.
#
# Single node, KRaft combined mode: one process is both broker and controller.

# --- Identity and quorum ---------------------------------------------------------------------
process.roles=broker,controller
node.id=1
# Dynamic quorum (Kafka 4 default). The storage is formatted with --standalone,
# so this node is the only voter.
controller.quorum.bootstrap.servers=127.0.0.1:9093

# --- Listeners -------------------------------------------------------------------------------
# CONTROLLER: KRaft traffic between the broker and controller roles of this same
#   process. Bound to loopback only and unauthenticated.
# INTERNAL / EXTERNAL: client listeners, both SASL/SCRAM. INTERNAL is what other
#   containers use; EXTERNAL is for clients outside Docker. In production there is
#   a single client listener on the Tailscale address (WireGuard encrypts it,
#   hence SASL_PLAINTEXT rather than SASL_SSL).
# [deploy]
listeners=CONTROLLER://127.0.0.1:9093,INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
# [deploy]
advertised.listeners=INTERNAL://kafka:9092,EXTERNAL://localhost:19092
listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
controller.listener.names=CONTROLLER
inter.broker.listener.name=INTERNAL

# --- Authentication --------------------------------------------------------------------------
sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
# The broker authenticates to its own INTERNAL listener as `admin`. The admin
# credential is created when the storage is formatted (kafka-storage.sh
# format --add-scram), because SCRAM users are stored in the cluster metadata,
# which doesn't exist before the first start.
# [deploy] password
listener.name.internal.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="dev-admin";
# Every SASL listener needs a JAAS entry. A listener that isn't used for
# inter-broker traffic only verifies clients, so it needs no credential.
# [deploy] not present in production (single client listener)
listener.name.external.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;

# --- Authorization ---------------------------------------------------------------------------
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
# admin: the platform's admin client (topic and ACL management).
# ANONYMOUS: requests arriving on the CONTROLLER listener, which is PLAINTEXT and
#   bound to 127.0.0.1, so only processes on the broker host can reach it.
super.users=User:admin;User:ANONYMOUS
# Without a matching ACL, a request is denied. Every client gets ACLs per topic
# and consumer group from `leasehold kafka apply`.
allow.everyone.if.no.acl.found=false

# --- Topics ----------------------------------------------------------------------------------
# Topics are created only by `leasehold kafka apply`, from service.yml. A typo in a
# producer must fail, not create a new topic.
auto.create.topics.enable=false
num.partitions=1
default.replication.factor=1
min.insync.replicas=1
# Internal topics on a single node can't have more than one replica.
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1

# --- Log storage -----------------------------------------------------------------------------
log.dirs=/var/lib/kafka/data
# Every leasehold topic sets retention.ms itself; this default only applies to
# topics created by hand.
log.retention.hours=24
# 256 MiB segments instead of the 1 GiB default: retention deletes whole
# segments, so smaller segments make time- and size-based retention more precise.
log.segment.bytes=268435456
log.retention.check.interval.ms=300000
num.recovery.threads.per.data.dir=1

# --- Messages --------------------------------------------------------------------------------
# 2 MiB. Payloads above ~1 MiB go to object storage (claim check) and the
# message carries a reference, so this leaves headroom without inviting large
# messages.
message.max.bytes=2097152
# Keep whatever compression the producer used (leasehold producers use zstd).
compression.type=producer

# --- Threads and buffers (Kafka defaults) ----------------------------------------------------
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# --- Consumer groups -------------------------------------------------------------------------
# Default 3000 ms. Lower in dev so tests don't wait for a rebalance.
# [deploy]
group.initial.rebalance.delay.ms=0
