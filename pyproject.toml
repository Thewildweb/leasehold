[project]
name = "leasehold"
version = "0.1.0"
description = "A polite crawl platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "confluent-kafka>=2.6",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "publicsuffixlist>=1.0",
    "idna>=3.7",
]

[project.optional-dependencies]
# The control API and the frontier store. Components don't need these: they talk
# to the control API over HTTP.
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.9",
]

[project.scripts]
leasehold = "leasehold.cli:main"

[dependency-groups]
dev = [
    "leasehold[server]",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
# confluent-kafka is marked typed but re-exports its admin classes without __all__,
# so every import from confluent_kafka.admin is reported as private.
reportPrivateImportUsage = false
